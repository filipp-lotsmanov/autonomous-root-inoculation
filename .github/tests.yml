name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No display on the runner; force matplotlib's non-interactive backend.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Verify PID scripts run end to end
        working-directory: controllers/pid
        run: |
          uv run python validate_gains.py
          uv run python optimize_gains.py
